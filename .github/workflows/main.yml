name: Android CI Bionic

on:
  push:
    branches: [ "ludashi-3.0" ]
  pull_request:
    branches: [ "ludashi-3.0" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Clone linkernsbypass
      run: |
        mkdir -p app/src/main/cpp/adrenotools/lib
        git clone https://github.com/Pipetto-crypto/liblinkernsbypass.git app/src/main/cpp/adrenotools/lib/linkernsbypass

    - name: Checkout winlator-glibc
      uses: actions/checkout@v4
      with:
        repository: moze30/winlator-glibc
        path: winlator-glibc

    - name: Port AIDL files from winlator-glibc
      run: |
        mkdir -p app/src/main/aidl/com/termux/x11
        cp -r winlator-glibc/app/src/main/aidl/com/termux/x11/* app/src/main/aidl/com/termux/x11/
        rm -rf winlator-glibc

    - name: Inject AIDL configuration into build.gradle
      run: |
        if ! grep -q "aidl = true" app/build.gradle; then
          sed -i '/android {/a \    buildFeatures {\n        aidl = true\n    }' app/build.gradle
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install Shader Compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y glslang-tools

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
